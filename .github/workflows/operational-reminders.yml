# Avisos WhatsApp dos postos (documentos, plano, RAQ, etc.)
# Roda sozinho a cada hora — não depende de login do admin.

name: Operational reminders

on:
  schedule:
    # A cada hora (UTC). Fila Z-API + marcos do dia.
    - cron: '5 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar operational-reminders
        env:
          SECRET: ${{ secrets.OPERATIONAL_CRON_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "Falta o secret OPERATIONAL_CRON_SECRET no GitHub."
            exit 1
          fi
          code=$(curl -sS -o /tmp/cron-body.json -w "%{http_code}" -X POST \
            "https://jilzklxnejztpphbryti.supabase.co/functions/v1/operational-reminders" \
            -H "Content-Type: application/json" \
            -H "x-operational-cron-secret: ${SECRET}" \
            -d '{}')
          echo "HTTP $code"
          cat /tmp/cron-body.json
          test "$code" = "200"
