# Avisos WhatsApp dos postos (documentos, plano, RAQ, etc.)
# Roda sozinho a cada hora — não depende de login do admin.

name: Operational reminders

on:
  schedule:
    # A cada hora (UTC). Fila Meta templates + marcos do dia.
    - cron: '5 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disparar operational-reminders
        env:
          SECRET: ${{ secrets.OPERATIONAL_CRON_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "Falta o secret OPERATIONAL_CRON_SECRET no GitHub."
            exit 1
          fi
          code=$(curl -sS -o /tmp/cron-body.json -w "%{http_code}" --max-time 240 -X POST \
            "https://jilzklxnejztpphbryti.supabase.co/functions/v1/operational-reminders" \
            -H "Content-Type: application/json" \
            -H "x-operational-cron-secret: ${SECRET}" \
            -d '{}')
          echo "HTTP $code"
          cat /tmp/cron-body.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "Falha ao chamar operational-reminders (HTTP $code)."
            exit 1
          fi
          # Resposta JSON com ok:false ainda conta como falha operacional
          if grep -q '"ok":false' /tmp/cron-body.json 2>/dev/null; then
            echo "Function respondeu ok:false."
            exit 1
          fi
