# Alertas do admin (cotas, Resend, domínio).
# Roda no horário comercial de Brasília (08:20–17:20). Cada tipo só envia 1x por dia.
# A fila dos postos é do workflow Operational reminders (não bloqueia este).

name: Admin management alerts

on:
  schedule:
    - cron: '20 11-20 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Disparar admin-management-alerts
        env:
          SECRET: ${{ secrets.ADMIN_MGMT_CRON_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "Falta o secret ADMIN_MGMT_CRON_SECRET no GitHub."
            exit 1
          fi
          code=$(curl -sS -o /tmp/cron-body.json -w "%{http_code}" --max-time 120 -X POST \
            "https://jilzklxnejztpphbryti.supabase.co/functions/v1/admin-management-alerts" \
            -H "Content-Type: application/json" \
            -H "x-admin-mgmt-cron-secret: ${SECRET}" \
            -d '{}')
          echo "HTTP $code"
          cat /tmp/cron-body.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "Falha ao chamar admin-management-alerts (HTTP $code)."
            exit 1
          fi
